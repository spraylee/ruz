name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new SemVer tag to build, for example v0.2.0"
        required: true
        default: "v0.2.0"
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            family: linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            family: linux
          - os: macos-latest
            target: x86_64-apple-darwin
            family: darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            family: darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.family == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          command -v musl-gcc
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          extra_flags="-D warnings"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
            extra_flags="-C target-feature=+crt-static -D warnings"
          fi
          export RUSTFLAGS="$extra_flags"
          cargo build --release --target "${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/ruz"
          if command -v llvm-strip >/dev/null 2>&1; then
            llvm-strip "$bin" || true
          elif command -v strip >/dev/null 2>&1; then
            strip "$bin" || true
          fi
          test -x "$bin"

      - name: Verify linux musl static linking
        if: matrix.family == 'linux'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/ruz"
          file "$bin"
          if file "$bin" | grep -Eiq 'statically linked|static-pie linked'; then
            echo "static link: ok"
          else
            echo "expected statically linked musl binary" >&2
            exit 1
          fi
          if command -v ldd >/dev/null 2>&1; then
            ldd "$bin" >/tmp/ldd.out 2>&1 || true
            # new ldd prints "statically linked" (exit 0); old ldd errors
            # with "not a dynamic executable". Both are static-binary OK.
            if grep -Eiq 'statically linked|not a dynamic' /tmp/ldd.out; then
              echo "ldd confirms static: $(cat /tmp/ldd.out)"
            else
              echo "ldd output unexpected for a static binary:" >&2
              cat /tmp/ldd.out >&2
              exit 1
            fi
          fi

      - name: Verify darwin architecture
        if: matrix.family == 'darwin'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/ruz"
          file "$bin"
          case "${{ matrix.target }}" in
            x86_64-apple-darwin)
              file "$bin" | grep -Eiq 'x86_64|Mach-O 64-bit'
              ;;
            aarch64-apple-darwin)
              file "$bin" | grep -Eiq 'arm64|aarch64|Mach-O 64-bit'
              ;;
          esac

      - name: Stage asset
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp "target/${{ matrix.target }}/release/ruz" "artifact/ruz-${{ matrix.target }}"
          chmod 755 "artifact/ruz-${{ matrix.target }}"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: ruz-${{ matrix.target }}
          path: artifact/ruz-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Package and publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ruz-*
          path: artifacts
          merge-multiple: true

      - name: Assemble dist and SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            test -f "artifacts/ruz-${target}"
            cp "artifacts/ruz-${target}" "dist/ruz-${target}"
            chmod 755 "dist/ruz-${target}"
          done
          cp scripts/bootstrap.sh dist/bootstrap.sh
          chmod 755 dist/bootstrap.sh
          (cd dist && sha256sum \
            ruz-x86_64-unknown-linux-musl \
            ruz-aarch64-unknown-linux-musl \
            ruz-x86_64-apple-darwin \
            ruz-aarch64-apple-darwin \
            bootstrap.sh > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ruz ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/ruz-x86_64-unknown-linux-musl
            dist/ruz-aarch64-unknown-linux-musl
            dist/ruz-x86_64-apple-darwin
            dist/ruz-aarch64-apple-darwin
            dist/bootstrap.sh
            dist/SHA256SUMS
          body: |
            # ruz ${{ env.RELEASE_TAG }}

            Install:

            ```sh
            curl -fsSL https://ruz.spraylee.com/i | sh
            ```

            Native binaries: `ruz-<target>` (linux musl static, apple-darwin).
            Changes: see https://github.com/spraylee/ruz/releases (commit log).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
